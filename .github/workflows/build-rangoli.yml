# Builds the Rangoli Studio APK on GitHub's servers whenever rangoli-studio/ changes (or by hand from the Actions tab).
# The APK is attached to a "Rangoli Studio build N" release, kept separate from the Khel Khel Mein test releases.
name: Build Rangoli Studio APK
on:
  push:
    paths: ['rangoli-studio/**', '.github/workflows/build-rangoli.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rangoli-studio
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk rangoli-studio.apk
      - uses: actions/upload-artifact@v4
        with: { name: rangoli-studio-apk, path: rangoli-studio/rangoli-studio.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rangoli-${{ github.run_number }}
          name: Rangoli Studio build ${{ github.run_number }}
          make_latest: false
          files: rangoli-studio/rangoli-studio.apk
